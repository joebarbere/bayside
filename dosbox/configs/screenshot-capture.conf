# DOSBox-X config for automated DeskMate screenshot capture
# Captures internal DOSBox screenshots (not macOS window captures)

[sdl]
fullscreen=false
output=opengl
windowposition=0,0

[dosbox]
machine=tandy
memsize=640

[render]
aspect=true
scaler=normal2x

[cpu]
core=normal
cputype=8086
cycles=4000

[sblaster]
sbtype=none

[midi]
mpu401=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=false
ems=false
umb=false

[autoexec]
mount c ./archive/deskmate-3.05/extracted
c:
SET DMCONFIG=C:\
DESK.EXE
