# DOSBox-X configuration for running Tandy DeskMate 3.05
# Uses Tandy machine type for TGA video + 3-voice sound + DAC

[sdl]
fullscreen=false
output=opengl

[dosbox]
machine=tandy
memsize=640

[render]
aspect=true
scaler=normal2x

[cpu]
core=normal
cputype=8086
cycles=4000

[sblaster]
sbtype=none

[midi]
mpu401=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=false
ems=false
umb=false

[autoexec]
# Mount the DeskMate directory as C:
# Adjust the path below to point to your DeskMate files
mount c ./archive/deskmate-3.05
c:
SET DMCONFIG=C:\
# DESK.EXE
